[package]
edition.workspace = true
license.workspace = true
name = "rexux-analytics"
version.workspace = true

[lib]
doctest = false
name = "rexux_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
rexux-app-server-protocol = { workspace = true }
rexux-git-utils = { workspace = true }
rexux-login = { workspace = true }
rexux-model-provider = { workspace = true }
rexux-plugin = { workspace = true }
rexux-protocol = { workspace = true }
rexux-state = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
rexux-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
