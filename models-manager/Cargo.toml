[package]
edition.workspace = true
license.workspace = true
name = "rexux-models-manager"
version.workspace = true

[lib]
doctest = false
name = "rexux_models_manager"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
rexux-collaboration-mode-templates = { workspace = true }
rexux-http-client = { workspace = true }
rexux-login = { workspace = true }
rexux-otel = { workspace = true }
rexux-protocol = { workspace = true }
rexux-utils-output-truncation = { workspace = true }
rexux-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
