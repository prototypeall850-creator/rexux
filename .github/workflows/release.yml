name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            arch: arm64
          - target: x86_64-linux-android
            arch: x86
    steps:
      - uses: actions/checkout@v4

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins channel 1.95.0, which makes the action's
      # `targets` input unreliable — ensure the Android target is present.
      - name: ensure Android target installed
        run: rustup target add ${{ matrix.target }}

      - name: install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: configure cargo NDK linkers
        run: |
          {
            echo "[target.aarch64-linux-android]";
            echo "linker = \"${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang\"";
            echo "[target.x86_64-linux-android]";
            echo "linker = \"${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang\"";
          } >> "$GITHUB_WORKSPACE/.cargo-ndk-linkers.toml"
          mkdir -p ~/.cargo
          cat "$GITHUB_WORKSPACE/.cargo-ndk-linkers.toml" >> ~/.cargo/config.toml
          # C build scripts (aws-lc-sys, ring, openssl-sys via `cc`) look for
          # plain <target>-clang / <target>-ar on PATH. NDK r27 only ships
          # API-suffixed wrappers, so expose shims on PATH.
          BIN_DIR="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p "$GITHUB_WORKSPACE/.ndk-shims"
          for triple in aarch64-linux-android x86_64-linux-android; do
            ln -sf "$BIN_DIR/${triple}35-clang" "$GITHUB_WORKSPACE/.ndk-shims/${triple}-clang"
            ln -sf "$BIN_DIR/${triple}35-clang++" "$GITHUB_WORKSPACE/.ndk-shims/${triple}-clang++"
            ln -sf "$BIN_DIR/llvm-ar" "$GITHUB_WORKSPACE/.ndk-shims/${triple}-ar"
            ln -sf "$BIN_DIR/llvm-ranlib" "$GITHUB_WORKSPACE/.ndk-shims/${triple}-ranlib"
            ln -sf "$BIN_DIR/llvm-strip" "$GITHUB_WORKSPACE/.ndk-shims/${triple}-strip"
          done
          echo "$GITHUB_WORKSPACE/.ndk-shims" >> "$GITHUB_PATH"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: build rexux (${{ matrix.target }})
        run: cargo build --profile release-termux -p rexux-cli --target ${{ matrix.target }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # Belt and suspenders alongside the PATH shims above.
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
          CC_x86_64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          AR_x86_64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CFLAGS_aarch64_linux_android: --target=aarch64-linux-android35
          CFLAGS_x86_64_linux_android: --target=x86_64-linux-android35

      - name: stage asset
        run: |
          cp "target/${{ matrix.target }}/release-termux/rexux" \
             "rexux-${{ github.ref_name }}-${{ matrix.target }}"
          chmod +x "rexux-${{ github.ref_name }}-${{ matrix.target }}"
          # Belt and suspenders: strip again with the NDK llvm-strip and report size.
          "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            "rexux-${{ github.ref_name }}-${{ matrix.target }}" || true
          ls -lh "rexux-${{ github.ref_name }}-${{ matrix.target }}"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: rexux-${{ github.ref_name }}-${{ matrix.target }}
          generate_release_notes: true
