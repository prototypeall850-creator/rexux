[package]
edition.workspace = true
license.workspace = true
name = "rexux-memories-extension"
version.workspace = true

[lib]
name = "rexux_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
rexux-core = { workspace = true }
rexux-extension-api = { workspace = true }
rexux-features = { workspace = true }
rexux-otel = { workspace = true }
rexux-tools = { workspace = true }
rexux-utils-absolute-path = { workspace = true }
rexux-utils-output-truncation = { workspace = true }
rexux-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
