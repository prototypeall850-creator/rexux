[package]
name = "rexux-app-server-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rexux_app_server_protocol"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
rexux-experimental-api-macros = { workspace = true }
rexux-app-server-protocol-noop-macros = { workspace = true }
rexux-extension-items = { workspace = true }
rexux-history = { workspace = true }
rexux-protocol = { workspace = true }
rexux-rollout = { workspace = true }
rexux-secrets = { workspace = true }
rexux-shell-command = { workspace = true }
rexux-utils-absolute-path = { workspace = true }
rexux-utils-path-uri = { workspace = true }
rexux-utils-redacted-string = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "server",
] }
inventory = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }
zstd = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
rexux-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
schemars = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
ts-rs = { workspace = true }
