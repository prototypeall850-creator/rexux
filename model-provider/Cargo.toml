[package]
edition.workspace = true
license.workspace = true
name = "rexux-model-provider"
version.workspace = true

[lib]
doctest = false
name = "rexux_model_provider"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
rexux-api = { workspace = true }
rexux-agent-identity = { workspace = true }
rexux-aws-auth = { workspace = true }
rexux-http-client = { workspace = true }
rexux-feedback = { workspace = true }
rexux-login = { workspace = true }
rexux-model-provider-info = { workspace = true }
rexux-models-manager = { workspace = true }
rexux-otel = { workspace = true }
rexux-protocol = { workspace = true }
rexux-response-debug-context = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["process", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
rexux-utils-redacted-string = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
