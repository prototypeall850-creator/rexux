[package]
edition.workspace = true
license.workspace = true
name = "rexux-core"
version.workspace = true

[lib]
name = "rexux_core"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
base64 = { workspace = true }
bm25 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
rexux-analytics = { workspace = true }
rexux-agent-graph-store = { workspace = true }
rexux-agent-roles = { workspace = true }
rexux-api = { workspace = true }
rexux-app-server-protocol = { workspace = true }
rexux-apply-patch = { workspace = true }
rexux-async-utils = { workspace = true }
rexux-client = { workspace = true }
rexux-code-mode = { workspace = true }
rexux-connectors = { workspace = true }
rexux-context-fragments = { workspace = true }
rexux-config = { workspace = true }
rexux-core-plugins = { workspace = true }
rexux-diagnostics = { workspace = true }
rexux-exec-server = { workspace = true }
rexux-extension-api = { workspace = true }
rexux-extension-items = { workspace = true }
rexux-features = { workspace = true }
rexux-feedback = { workspace = true }
rexux-file-system = { workspace = true }
rexux-login = { workspace = true }
rexux-memories-read = { workspace = true }
rexux-mcp = { workspace = true }
rexux-model-provider-info = { workspace = true }
rexux-models-manager = { workspace = true }
rexux-shell-command = { workspace = true }
rexux-execpolicy = { workspace = true }
rexux-git-utils = { workspace = true }
rexux-guardian-context = { workspace = true }
rexux-history = { workspace = true }
rexux-hooks = { workspace = true }
rexux-http-client = { workspace = true }
rexux-install-context = { workspace = true }
rexux-network-proxy = { workspace = true }
rexux-otel = { workspace = true }
rexux-plugin = { workspace = true }
rexux-model-provider = { workspace = true }
rexux-protocol = { workspace = true }
rexux-response-debug-context = { workspace = true }
rexux-prompts = { workspace = true }
rexux-rollout = { workspace = true }
rexux-rollout-trace = { workspace = true }
rexux-rmcp-client = { workspace = true }
rexux-sandboxing = { workspace = true }
rexux-skills = { workspace = true }
rexux-skills-extension = { workspace = true }
rexux-state = { workspace = true }
rexux-terminal-detection = { workspace = true }
rexux-thread-store = { workspace = true }
rexux-tools = { workspace = true }
rexux-utils-absolute-path = { workspace = true }
rexux-utils-audio = { workspace = true }
rexux-utils-cache = { workspace = true }
rexux-utils-git-discovery = { workspace = true }
rexux-utils-image = { workspace = true }
rexux-utils-home-dir = { workspace = true }
rexux-utils-output-truncation = { workspace = true }
rexux-utils-path = { workspace = true }
rexux-utils-path-uri = { workspace = true }
rexux-utils-plugins = { workspace = true }
rexux-utils-pty = { workspace = true }
rexux-utils-string = { workspace = true }
rexux-utils-stream-parser = { workspace = true }
rexux-utils-file-lock = { workspace = true }
rexux-windows-sandbox = { package = "rexux-windows-sandbox", path = "../windows-sandbox-rs" }
dirs = { workspace = true }
dunce = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
indexmap = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex-lite = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5", "v7"] }
which = { workspace = true }
whoami = { workspace = true }

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# Build OpenSSL from source for musl builds.
[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
rexux-shell-escalation = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
rexux-exec-server-test-support = { workspace = true }
rexux-image-generation-extension = { workspace = true }
rexux-home = { workspace = true }
rexux-otel = { workspace = true }
rexux-test-binary-support = { workspace = true }
rexux-utils-cargo-bin = { workspace = true }
rexux-utils-redacted-string = { workspace = true }
rexux-web-search-extension = { workspace = true }
core_test_support = { workspace = true }
ctor = { workspace = true }
insta = { workspace = true }
maplit = { workspace = true }
opentelemetry = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
test-case = "3.3.1"
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
walkdir = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
ignored-paths = ["tests/remote_env_windows/*.rs"]
